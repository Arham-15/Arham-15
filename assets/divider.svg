<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="30">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.4; transform: scaleX(0.92); }
      50% { opacity: 1; transform: scaleX(1.02); }
    }
    @keyframes coreRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sweep {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(900px); }
    }
    .beam { animation: pulseBeam 3s ease-in-out infinite; transform-origin: center; }
    .core { animation: coreRotate 8s linear infinite; transform-origin: 450px 15px; }
    .photon { animation: sweep 3.5s ease-in-out infinite; }
  </style>

  <!-- Base Line -->
  <line x1="50" y1="15" x2="850" y2="15" stroke="url(#dividerGrad)" stroke-width="1.5" class="beam" />

  <!-- Moving Glass Light Pulse / Photon -->
  <g class="photon">
    <ellipse cx="0" cy="15" rx="40" ry="2" fill="url(#glowLaser)" filter="url(#laserGlow)" opacity="0.85" />
    <circle cx="0" cy="15" r="2.5" fill="#ffffff" filter="url(#laserGlow)" />
  </g>

  <!-- Central Glass Diamond Core -->
  <g class="core">
    <rect x="444" y="9" width="12" height="12" rx="2" fill="#111827" stroke="#00f2fe" stroke-width="1.5" filter="url(#laserGlow)" />
    <circle cx="450" cy="15" r="2.5" fill="#ffffff" />
  </g>
</svg>
