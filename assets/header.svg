<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Glassmorphic Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#e0aaff" />
    </linearGradient>

    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.8" />
    </linearGradient>

    <!-- Blur & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -20px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 30px) scale(1.2); }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 10px #00f2fe); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 200; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes badgePulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: center; }
    .node { animation: pulseNode 3s ease-in-out infinite; transform-origin: center; }
    .stream { stroke-dasharray: 20, 40; animation: dataStream 4s linear infinite; }
    .live-dot { animation: badgePulse 2s ease-in-out infinite; }
    
    .role-text-1 { animation: role1 12s infinite; }
    .role-text-2 { animation: role2 12s infinite; }
    .role-text-3 { animation: role3 12s infinite; }

    @keyframes role1 {
      0%, 28% { opacity: 1; transform: translateY(0); }
      33%, 95% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes role2 {
      0%, 28% { opacity: 0; transform: translateY(-10px); }
      33%, 61% { opacity: 1; transform: translateY(0); }
      66%, 100% { opacity: 0; transform: translateY(10px); }
    }
    @keyframes role3 {
      0%, 61% { opacity: 0; transform: translateY(-10px); }
      66%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(10px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="320" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Glass Backlight Orbs -->
  <g class="orb-1">
    <circle cx="150" cy="80" r="110" fill="#00f2fe" opacity="0.18" filter="url(#orbGlow)" />
    <circle cx="780" cy="240" r="130" fill="#9d4edd" opacity="0.22" filter="url(#orbGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="720" cy="70" r="100" fill="#ff0080" opacity="0.15" filter="url(#orbGlow)" />
    <circle cx="280" cy="260" r="90" fill="#00f2fe" opacity="0.14" filter="url(#orbGlow)" />
  </g>

  <!-- Neural Mesh / Graph Background Lines (Right Side) -->
  <g opacity="0.45">
    <line x1="560" y1="70" x2="680" y2="120" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="680" y1="120" x2="820" y2="80" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="680" y1="120" x2="740" y2="200" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="740" y1="200" x2="850" y2="180" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="560" y1="210" x2="680" y2="120" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="560" y1="210" x2="740" y2="200" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="740" y1="200" x2="780" y2="270" stroke="url(#neuralGrad)" stroke-width="1.5" />
    <line x1="820" y1="80" x2="850" y2="180" stroke="url(#neuralGrad)" stroke-width="1.5" />

    <!-- Animated Data Streams -->
    <line x1="560" y1="70" x2="680" y2="120" stroke="#00f2fe" stroke-width="2" class="stream" />
    <line x1="680" y1="120" x2="740" y2="200" stroke="#ff0080" stroke-width="2" class="stream" style="animation-delay: 1.2s;" />
    <line x1="740" y1="200" x2="850" y2="180" stroke="#9d4edd" stroke-width="2" class="stream" style="animation-delay: 2.1s;" />

    <!-- Neural Nodes -->
    <circle cx="560" cy="70" r="5" fill="#00f2fe" class="node" filter="url(#glow)" />
    <circle cx="680" cy="120" r="7" fill="#ffffff" class="node" style="animation-delay: 0.5s;" filter="url(#glow)" />
    <circle cx="820" cy="80" r="5" fill="#e0aaff" class="node" style="animation-delay: 1s;" filter="url(#glow)" />
    <circle cx="560" cy="210" r="6" fill="#4facfe" class="node" style="animation-delay: 1.5s;" filter="url(#glow)" />
    <circle cx="740" cy="200" r="8" fill="#00f2fe" class="node" style="animation-delay: 0.8s;" filter="url(#glow)" />
    <circle cx="850" cy="180" r="5" fill="#ff0080" class="node" style="animation-delay: 2s;" filter="url(#glow)" />
    <circle cx="780" cy="270" r="5" fill="#9d4edd" class="node" style="animation-delay: 1.7s;" filter="url(#glow)" />
  </g>

  <!-- Glassmorphic Card Container -->
  <rect x="20" y="20" width="880" height="280" rx="18" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.5" />
  
  <!-- Glass Reflection Highlight Strip -->
  <path d="M 22 38 Q 450 15 878 38" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" fill="none" />

  <!-- Status Pill / Live Badge -->
  <g transform="translate(50, 46)">
    <rect width="250" height="30" rx="15" fill="#00f2fe" fill-opacity="0.08" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4.5" fill="#00f2fe" class="live-dot" filter="url(#glow)" />
    <text x="32" y="19" fill="#00f2fe" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">
      STATUS: EXPLORING &amp; BUILDING
    </text>
  </g>

  <!-- Main Headline for Arham -->
  <g transform="translate(50, 125)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Hi, I'm <tspan fill="url(#neonCyan)">Arham</tspan> 👋
    </text>
    <text y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan fill="url(#neonPurple)">AI Engineer</tspan> &amp; Data Science Scholar
    </text>
  </g>

  <!-- Cycling Animated Subtitle / Role Typewriter -->
  <g transform="translate(52, 212)">
    <g class="role-text-1">
      <text font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#00f2fe" font-weight="500">
        &gt; Neural Networks | PyTorch | LLM Architecture | Transformers 🧠
      </text>
    </g>
    <g class="role-text-2">
      <text font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#c77dff" font-weight="500">
        &gt; Autonomous AI Agents | RAG Systems | LangChain | MLOps ⚡
      </text>
    </g>
    <g class="role-text-3">
      <text font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#4facfe" font-weight="500">
        &gt; Deep Learning | Computer Vision | Big Data | Predictive Analytics 📊
      </text>
    </g>
  </g>

  <!-- Mini Glass Tech Pillars Footer in Header Card -->
  <g transform="translate(50, 246)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="105" height="24" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="52" y="16" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">🧠 Deep Learning</text>

    <!-- Pill 2 -->
    <rect x="115" y="0" width="100" height="24" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="165" y="16" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">🤖 GenAI &amp; LLMs</text>

    <!-- Pill 3 -->
    <rect x="225" y="0" width="100" height="24" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="275" y="16" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">📈 Data Science</text>

    <!-- Pill 4 -->
    <rect x="335" y="0" width="90" height="24" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="380" y="16" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">⚙️ MLOps</text>
  </g>

</svg>
